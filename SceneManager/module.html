<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szenen</title>
<style>
:root{color-scheme:dark;--bg:#111827;--card:#1f2937;--border:#374151;--muted:#9ca3af;--text:#f3f4f6;--accent:#f59e0b;--blue:#3b82f6;--red:#ef4444;--green:#10b981}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:transparent;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:12px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.shell{max-width:920px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 14px}.title{font-size:20px;font-weight:750;display:flex;align-items:center;gap:9px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--border);background:#263244;padding:8px 12px;border-radius:10px;font-weight:650;transition:.15s}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--blue);border-color:transparent}.btn.success{background:#059669;border-color:transparent}.btn.danger{background:#7f1d1d;border-color:#991b1b}.btn.small{padding:6px 9px;font-size:12px}.btn.icon{padding:5px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px}.scene{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 10px 24px #0002}.scene.active{border-color:#10b98180;box-shadow:0 0 0 1px #10b98130,0 10px 24px #0002}
.scene-head{display:flex;align-items:flex-start;gap:9px}.scene-icon{font-size:22px}.scene-name{font-size:16px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}.active-tag{font-size:10px;color:#6ee7b7;border:1px solid #05966970;background:#064e3b70;padding:2px 7px;border-radius:999px}
.device-list{display:grid;gap:7px;margin:12px 0}.device-chip{border:1px solid #ffffff12;background:#11182780;border-radius:10px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.device-chip .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device-chip .value{font-size:12px;color:#cbd5e1;white-space:nowrap}
.empty{border:1px dashed var(--border);border-radius:12px;padding:13px;color:var(--muted);text-align:center;font-size:12px}
.actions{display:flex;gap:7px}.actions .primary{flex:1}
.modal-wrap{display:none;position:fixed;inset:0;background:#0009;z-index:99;padding:12px;align-items:flex-start;justify-content:center;overflow:auto}.modal-wrap.open{display:flex}.modal{background:#111827;border:1px solid #4b5563;border-radius:16px;width:min(760px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;box-shadow:0 25px 70px #0008}.modal-head,.modal-foot{padding:12px 14px;border-bottom:1px solid #374151;display:flex;align-items:center;justify-content:space-between;gap:9px}.modal-foot{border-bottom:0;border-top:1px solid #374151;justify-content:flex-end}.modal-title{font-weight:750;font-size:16px}.modal-body{padding:13px;overflow:auto;display:grid;gap:13px;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}.modal-body::-webkit-scrollbar{width:9px}.modal-body::-webkit-scrollbar-track{background:#0b1220;border-radius:8px}.modal-body::-webkit-scrollbar-thumb{background:#526176;border:2px solid #0b1220;border-radius:8px}
.field{display:grid;gap:5px}.field label,.small-label{font-size:11px;color:#cbd5e1;font-weight:650}.input{width:100%;background:#1f2937;border:1px solid #4b5563;border-radius:9px;padding:9px 10px;outline:none}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 2px #3b82f633}
.search-results{display:grid;gap:6px;max-height:190px;overflow:auto}.result{border:1px solid var(--border);background:#1f2937;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}.result:hover{border-color:#60a5fa}.result-name{font-size:12px;font-weight:650}.result-path{font-size:10px;color:var(--muted);overflow-wrap:anywhere}
.device-picker{display:grid;gap:9px;border:1px solid var(--border);background:#151e2b;border-radius:12px;padding:10px}.category-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.category-choice{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:10px 11px}.picker-header{display:flex;align-items:center;gap:8px}.picker-header .btn{flex:none}.picker-title{font-size:13px;font-weight:750;flex:1}.catalog-items{display:grid;max-height:42vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:9px}.catalog-items::-webkit-scrollbar{width:9px}.catalog-items::-webkit-scrollbar-track{background:#0b1220}.catalog-items::-webkit-scrollbar-thumb{background:#526176;border:2px solid #0b1220;border-radius:8px}.catalog-item{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-top:1px solid #ffffff0d;cursor:pointer}.catalog-item:first-child{border-top:0}.catalog-item:hover{background:#ffffff08}.catalog-item input{margin:2px 0 0;accent-color:#3b82f6}.catalog-label{font-size:12px;font-weight:650}.catalog-path{display:block;font-size:10px;color:var(--muted);overflow-wrap:anywhere}.catalog-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.icon-select{display:flex;gap:8px;align-items:center}.icon-select select{width:100%;background:#1f2937;border:1px solid #4b5563;border-radius:9px;padding:9px 10px}
.target-list{display:grid;gap:8px}.target{background:#1b2533;border:1px solid #374151;border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px}.target-head{grid-column:1/-1;display:flex;align-items:flex-start;gap:8px}.target-title{font-size:12px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}.target-type{display:block;color:var(--muted);font-size:10px;font-weight:450}.target-value{min-width:0}.target-value input,.target-value select{width:100%;background:#111827;border:1px solid #4b5563;border-radius:8px;padding:8px}
.profile-note{font-size:10px;color:#94a3b8;margin-top:4px}.muted{color:var(--muted)}.toast{position:fixed;bottom:12px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#0f172a;border:1px solid #475569;border-radius:10px;padding:9px 13px;font-size:12px;z-index:110;transition:.2s;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){body{padding:8px}.top{align-items:flex-start}.top .btn{padding:7px 9px;font-size:12px}.grid{grid-template-columns:1fr}.modal-wrap{padding:6px}.modal{max-height:calc(100vh - 12px)}.scene{padding:12px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><div class="title">🎬 Szenen</div><div class="sub">Geräte und Zielwerte werden je Szene festgelegt.</div></div>
    <button class="btn primary" onclick="openSceneEditor()">＋ Neue Szene</button>
  </header>
  <div id="scenesGrid" class="grid"></div>
</div>
<div id="sceneModal" class="modal-wrap" onclick="if(event.target===this)closeSceneEditor()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head"><div class="modal-title" id="modalTitle">Szene</div><button class="btn icon" onclick="closeSceneEditor()" aria-label="Schließen">✕</button></header>
    <div class="modal-body">
      <div class="field"><label for="sceneName">Name der Szene</label><input class="input" id="sceneName" maxlength="80" placeholder="z. B. Feierabend"></div>
      <div class="field"><label for="sceneIcon">Symbol auswählen</label><div class="icon-select"><span id="sceneIconPreview" aria-hidden="true">🎬</span><select id="sceneIcon" onchange="updateIconPreview()"><option value="🎬">🎬 Film</option><option value="🏠">🏠 Zuhause</option><option value="🌙">🌙 Nacht</option><option value="☀️">☀️ Tag</option><option value="🌅">🌅 Morgen</option><option value="💡">💡 Licht</option><option value="🛋️">🛋️ Wohnen</option><option value="🛏️">🛏️ Schlafen</option><option value="🌡️">🌡️ Klima</option><option value="🚪">🚪 Tür</option><option value="🎉">🎉 Feier</option><option value="🔒">🔒 Abwesend</option><option value="✨">✨ Eigenes</option></select></div></div>
      <div class="field">
        <div class="small-label">Geräte dieser Szene und Zielwerte</div>
        <div id="targetList" class="target-list"></div>
        <button type="button" class="btn primary" onclick="openDevicePicker()">＋ Geräte hinzufügen</button>
        <div id="devicePicker" class="device-picker" hidden>
          <div id="categoryPicker"></div>
          <div id="categoryDevicePicker" hidden>
            <div class="picker-header"><button type="button" class="btn small" onclick="showDeviceCategories()">← Kategorien</button><div id="activeCategoryTitle" class="picker-title"></div></div>
            <input class="input" id="deviceSearch" autocomplete="off" placeholder="Gerät oder Raum in dieser Kategorie filtern">
            <div id="searchHint" class="profile-note">Mehrere Geräte anhaken, dann „Übernehmen“ wählen. Die Liste lässt sich scrollen.</div>
            <div id="deviceCatalog" class="catalog-items"></div>
            <div class="catalog-actions"><span id="selectionCount" class="profile-note">0 Geräte ausgewählt</span><button type="button" class="btn success" onclick="applySelectedDevices()">Übernehmen</button></div>
          </div>
        </div>
      </div>
    </div>
    <footer class="modal-foot"><button class="btn" onclick="closeSceneEditor()">Abbrechen</button><button class="btn success" onclick="saveSceneEditor()">💾 Szene speichern</button></footer>
  </section>
</div>
<div id="toast" class="toast"></div>
<script>
let currentState={scenes:[],sceneValues:{},deviceCatalog:[],activeSceneId:0};
let editorSceneId=null,editorTargets={},selectedDeviceIds=new Set(),activeCatalogCategory=null,devicePickerOpen=false,toastTimer=0;
window.handleMessage=function(data){
  try{
    const state=typeof data==='string'?JSON.parse(data):data;
    if(!state)return;
    currentState={...currentState,...state};
    renderScenes();
    renderDeviceCatalog();
    if(document.getElementById('sceneModal').classList.contains('open'))renderTargets();
    if(state.toast)showToast(state.toast);
  }catch(error){console.error('Szenenstatus konnte nicht gelesen werden',error);}
};
function request(ident,value){
  if(typeof window.requestAction==='function')window.requestAction(ident,value);
  else console.log('requestAction',ident,value);
}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));}
function sceneIcon(icon){return icon||'🎬';}
function updateIconPreview(){document.getElementById('sceneIconPreview').textContent=document.getElementById('sceneIcon').value||'🎬';}
function getTargets(sceneId){return (currentState.sceneValues||{})[String(sceneId)]||{};}
function renderScenes(){
  const grid=document.getElementById('scenesGrid');
  const scenes=currentState.scenes||[];
  if(!scenes.length){grid.innerHTML='<div class="empty">Noch keine Szenen. Lege eine Szene an und wähle dafür die gewünschten Geräte aus.</div>';return;}
  grid.innerHTML=scenes.map(scene=>{
    const id=Number(scene.id),targets=getTargets(id),entries=Object.values(targets);
    const active=id===Number(currentState.activeSceneId);
    const deviceHtml=entries.length?'<div class="device-list">'+entries.map(target=>'<div class="device-chip"><span class="label">'+escapeHtml(target.name||target.path||('Variable '+target.variableID))+'</span><span class="value">'+escapeHtml(formatValue(target.value,target))+'</span></div>').join('')+'</div>':'<div class="empty">Keine Geräte in dieser Szene</div>';
    return '<article class="scene '+(active?'active':'')+'"><div class="scene-head"><span class="scene-icon">'+escapeHtml(sceneIcon(scene.icon))+'</span><div class="scene-name">'+escapeHtml(scene.name||('Szene '+id))+'</div>'+(active?'<span class="active-tag">Aktiv</span>':'')+'</div>'+deviceHtml+'<div class="actions"><button class="btn primary" onclick="request(\'ExecuteScene\','+id+')">▶ Ausführen</button><button class="btn" onclick="openSceneEditor('+id+')">✎ Bearbeiten</button><button class="btn icon" title="Szene löschen" onclick="deleteScene('+id+',\''+escapeJs(scene.name||('Szene '+id))+'\')">🗑</button></div><button class="btn small" style="margin-top:8px;width:100%" onclick="request(\'SaveScene\','+id+')">Live-Werte der Szenengeräte übernehmen</button></article>';
  }).join('');
}
function escapeJs(value){return String(value??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]/g,' ');}
function formatValue(value,target){
  if(target&&Number(target.variableType)===0)return value?'Ein':'Aus';
  if(typeof value==='boolean')return value?'Ein':'Aus';
  if(value===null||value===undefined)return '—';
  const suffix=target&&target.profileSuffix?(' '+target.profileSuffix):'';
  return String(value)+suffix;
}
function openSceneEditor(sceneId=null){
  editorSceneId=sceneId===null?null:Number(sceneId);
  const scene=editorSceneId===null?null:(currentState.scenes||[]).find(item=>Number(item.id)===editorSceneId);
  document.getElementById('modalTitle').textContent=scene?'Szene bearbeiten':'Neue Szene';
  document.getElementById('sceneName').value=scene?(scene.name||''):'';
  const iconSelect=document.getElementById('sceneIcon'),iconValue=scene?(scene.icon||'🎬'):'🎬';
  if(!Array.from(iconSelect.options).some(option=>option.value===iconValue)){const option=document.createElement('option');option.value=iconValue;option.textContent=iconValue+' Aktuelles Symbol';iconSelect.appendChild(option);}
  iconSelect.value=iconValue;updateIconPreview();
  editorTargets=scene?JSON.parse(JSON.stringify(getTargets(editorSceneId))):{};
  selectedDeviceIds=new Set();activeCatalogCategory=null;devicePickerOpen=false;
  renderDeviceCatalog();renderTargets();
  document.getElementById('sceneModal').classList.add('open');
  document.getElementById('sceneName').focus();
}
function closeSceneEditor(){document.getElementById('sceneModal').classList.remove('open');editorSceneId=null;editorTargets={};selectedDeviceIds.clear();activeCatalogCategory=null;devicePickerOpen=false;}
function displayCategoryLabel(group){return group.label==='Klima'?'Klimageräte':group.label;}
function openDevicePicker(){devicePickerOpen=true;activeCatalogCategory=null;selectedDeviceIds.clear();renderDeviceCatalog();}
function showDeviceCategories(){activeCatalogCategory=null;selectedDeviceIds.clear();renderDeviceCatalog();}
function chooseCatalogCategory(label){activeCatalogCategory=label;selectedDeviceIds.clear();document.getElementById('deviceSearch').value='';renderDeviceCatalog();}
function renderDeviceCatalog(){
  const box=document.getElementById('deviceCatalog');if(!box)return;
  const picker=document.getElementById('devicePicker');picker.hidden=!devicePickerOpen;
  const groups=currentState.deviceCatalog||[];
  const categoryPicker=document.getElementById('categoryPicker'),devicePicker=document.getElementById('categoryDevicePicker');
  if(!devicePickerOpen){categoryPicker.innerHTML='';devicePicker.hidden=true;return;}
  categoryPicker.hidden=Boolean(activeCatalogCategory);devicePicker.hidden=!activeCatalogCategory;
  if(!activeCatalogCategory){
    categoryPicker.innerHTML='<div class="profile-note">Wähle zuerst einen Bereich aus:</div><div class="category-buttons">'+groups.map(group=>'<button type="button" class="btn category-choice" onclick="chooseCatalogCategory(\''+escapeJs(group.label)+'\')"><span>'+escapeHtml(displayCategoryLabel(group))+'</span><span class="muted">'+(group.items||[]).length+'</span></button>').join('')+'</div>';
    return;
  }
  const group=groups.find(item=>item.label===activeCatalogCategory);
  if(!group){activeCatalogCategory=null;renderDeviceCatalog();return;}
  document.getElementById('activeCategoryTitle').textContent=displayCategoryLabel(group);
  const query=document.getElementById('deviceSearch').value.trim().toLocaleLowerCase('de-DE');
  const items=(group.items||[]).slice().sort((a,b)=>String(a.selectionLabel||a.name||'').localeCompare(String(b.selectionLabel||b.name||''),'de-DE',{sensitivity:'base'})).filter(item=>!query||((item.selectionLabel||item.name||'')+' '+(item.path||'')).toLocaleLowerCase('de-DE').includes(query));
  const html=items.map(item=>{
      const id=Number(item.variableID),checked=selectedDeviceIds.has(String(id));
      return '<label class="catalog-item"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleCatalogSelection('+id+',this.checked)"><span class="catalog-label">'+escapeHtml(item.selectionLabel||item.name||('Variable '+id))+'</span></label>';
  }).join('');
  box.innerHTML=html||'<div class="empty">Keine passenden Geräte in dieser Kategorie gefunden.</div>';
  updateSelectionCount();
}
document.getElementById('deviceSearch').addEventListener('input',()=>renderDeviceCatalog());
function toggleCatalogSelection(id,checked){if(checked)selectedDeviceIds.add(String(id));else selectedDeviceIds.delete(String(id));updateSelectionCount();}
function updateSelectionCount(){const count=selectedDeviceIds.size,el=document.getElementById('selectionCount');if(el)el.textContent=count+' '+(count===1?'Gerät':'Geräte')+' ausgewählt';}
function applySelectedDevices(){
  const selectedGroup=(currentState.deviceCatalog||[]).find(group=>group.label===activeCatalogCategory);
  const byId=new Map();(selectedGroup?.items||[]).forEach(item=>byId.set(String(item.variableID),item));
  selectedDeviceIds.forEach(id=>{const item=byId.get(id);if(item&&!editorTargets[id])editorTargets[id]={...item,value:item.currentValue};});
  selectedDeviceIds.clear();devicePickerOpen=false;activeCatalogCategory=null;renderDeviceCatalog();renderTargets();
}
function renderTargets(){
  const box=document.getElementById('targetList');
  const entries=Object.values(editorTargets||{});
  if(!entries.length){box.innerHTML='<div class="empty">Noch keine Geräte in dieser Szene. Wähle sie über „Geräte hinzufügen“ aus.</div>';return;}
  box.innerHTML=entries.map(target=>{
    const id=Number(target.variableID),type=Number(target.variableType),associations=Array.isArray(target.associations)?target.associations:[];
    let input='';
    if(associations.length){
      input='<select onchange="setTargetValue('+id+',this.value)">'+associations.map(item=>{
        const value=item.Value,selected=sameValue(value,target.value);
        return '<option value="'+escapeHtml(String(value))+'" '+(selected?'selected':'')+'>'+escapeHtml(item.Name??value)+'</option>';
      }).join('')+'</select>';
    }else if(type===0){
      input='<select onchange="setTargetValue('+id+',this.value)"><option value="true" '+(target.value?'selected':'')+'>Ein</option><option value="false" '+(!target.value?'selected':'')+'>Aus</option></select>';
    }else if(type===1||type===2){
      const min=target.profileMin!==null&&target.profileMin!==undefined?' min="'+escapeHtml(target.profileMin)+'"':'';
      const max=target.profileMax!==null&&target.profileMax!==undefined?' max="'+escapeHtml(target.profileMax)+'"':'';
      const step=Number(target.profileStep)>0?' step="'+escapeHtml(target.profileStep)+'"':' step="any"';
      input='<input type="number" value="'+escapeHtml(target.value)+'"'+min+max+step+' onchange="setTargetValue('+id+',this.value)"><div class="profile-note">'+escapeHtml(target.profileName||'Kein Variablenprofil')+(target.profileStep?' · Schritt '+escapeHtml(target.profileStep):'')+'</div>';
    }else{
      input='<input type="text" value="'+escapeHtml(target.value)+'" onchange="setTargetValue('+id+',this.value)">';
    }
    return '<div class="target"><div class="target-head"><div class="target-title">'+escapeHtml(target.selectionLabel||target.name||target.path||('Variable '+id))+'</div><button class="btn icon" title="Aus Szene entfernen" onclick="removeDevice('+id+')">✕</button></div><div class="target-value">'+input+'</div></div>';
  }).join('');
}
function sameValue(a,b){
  if(typeof a==='boolean'||typeof b==='boolean')return boolValue(a)===boolValue(b);
  if(a!==null&&b!==null&&a!==undefined&&b!==undefined&&a!==''&&b!=='')return Number(a)===Number(b);
  return String(a)===String(b);
}
function boolValue(value){if(typeof value==='boolean')return value;if(typeof value==='number')return value!==0;return ['true','1','on','yes'].includes(String(value).toLowerCase());}
function setTargetValue(id,value){
  const target=editorTargets[String(id)];if(!target)return;
  if(Number(target.variableType)===0)target.value=boolValue(value);
  else if(Number(target.variableType)===1)target.value=Number.parseInt(value,10);
  else if(Number(target.variableType)===2)target.value=Number.parseFloat(value);
  else target.value=String(value);
}
function removeDevice(id){delete editorTargets[String(id)];renderTargets();}
function saveSceneEditor(){
  const sceneId=editorSceneId;
  const name=document.getElementById('sceneName').value.trim();
  if(!name){showToast('Bitte einen Namen für die Szene eingeben.');document.getElementById('sceneName').focus();return;}
  const payload={name,icon:document.getElementById('sceneIcon').value||'🎬',targets:editorTargets};
  closeSceneEditor();
  if(sceneId===null)request('CreateScene',JSON.stringify(payload));
  else request('UpdateScene',JSON.stringify({sceneId,...payload}));
}
function deleteScene(id,name){if(confirm('Szene „'+name+'“ löschen?'))request('DeleteScene',id);}
function showToast(message){
  const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');
  window.clearTimeout(toastTimer);toastTimer=window.setTimeout(()=>toast.classList.remove('show'),3000);
}
document.addEventListener('DOMContentLoaded',()=>request('GetTileState',''));
</script>
</body>
</html>
